<title>📺 掛網追蹤｜登入</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#f7f4ee;color:#3a322b;
  font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;}
.box{width:min(92vw,370px);background:#fff;border:1px solid #e7e1d7;border-radius:18px;
  padding:30px 24px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.ico{font-size:38px;line-height:1}
h1{font-size:20px;margin:8px 0 18px;letter-spacing:2px;color:#3a322b}
input{width:100%;padding:13px;margin-top:10px;border-radius:12px;border:1.5px solid #e7e1d7;
  background:#fdfcfa;color:#3a322b;font-size:16px;}
input:focus{outline:none;border-color:#a8763f;}
label{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b8278;margin-top:14px;}
label input{width:16px;height:16px;margin:0;accent-color:#a8763f;}
button{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;font-size:16px;
  font-weight:700;color:#fff;cursor:pointer;background:#a8763f;}
button:active{transform:scale(.98)}
#err{display:none;margin-top:12px;font-size:13px;color:#c05545;}
#busy{display:none;margin-top:12px;font-size:13px;color:#8b8278;}
</style>
</head>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>Uint8Array.from(h.match(/../g),x=>parseInt(x,16));
const subtle=crypto.subtle,enc=new TextEncoder(),dec=new TextDecoder();
const LS='uptrk_kek';

async function deriveKek(pass,saltB64){
  const base=await subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await subtle.deriveBits(
    {name:'PBKDF2',salt:d64(saltB64),iterations:DATA.iter,hash:'SHA-256'},base,256));
}
async function unwrap(acc,kekBytes){
  const kek=await subtle.importKey('raw',kekBytes,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:d64(acc.i)},kek,d64(acc.w)));
}
async function open(K){
  const kKey=await subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const pt=await subtle.decrypt({name:'AES-GCM',iv:d64(DATA.ivP)},kKey,d64(DATA.ct));
  const html=dec.decode(pt);
  // 不用 document.write（含外部 script 時會吃掉整個 body，見播音部署_build.mjs 註解）
  if(document.readyState==='loading')
    await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  const parsed=new DOMParser().parseFromString(html,'text/html');
  document.replaceChild(document.importNode(parsed.documentElement,true),document.documentElement);
  for(const oldTag of [...document.querySelectorAll('script')]){
    const s=document.createElement('script');
    for(const a of oldTag.attributes) s.setAttribute(a.name,a.value);
    if(oldTag.src){
      const done=new Promise(r=>{ s.onload=r; s.onerror=r; });
      oldTag.parentNode.replaceChild(s,oldTag);
      await done;
    }else{
      s.textContent=oldTag.textContent;
      oldTag.parentNode.replaceChild(s,oldTag);
    }
  }
}
(async()=>{
  try{
    const saved=localStorage.getItem(LS);
    if(!saved)return;
    const i=saved.indexOf(':');
    const u=saved.slice(0,i), kekHex=saved.slice(i+1);
    const acc=DATA.accounts.find(x=>x.u===u);
    if(!acc)throw new Error('帳號已移除');
    await open(await unwrap(acc,unhex(kekHex)));
  }catch(e){localStorage.removeItem(LS);}
})();
document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const err=document.getElementById('err'),busy=document.getElementById('busy');
  err.style.display='none';busy.style.display='block';
  const acc=DATA.accounts.find(a=>a.u===u);
  try{
    if(!acc)throw 0;
    const kekBytes=await deriveKek(p,acc.s);
    const K=await unwrap(acc,kekBytes);
    if(document.getElementById('rm').checked)
      localStorage.setItem(LS,acc.u+':'+hex(kekBytes));
    await open(K);
  }catch(e){busy.style.display='none';err.style.display='block';}
};
</script>
